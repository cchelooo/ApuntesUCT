name: Kubero images

on:
  push:
    branches: [main, chore/kubero-deployment]
    paths: ['backend/**', 'web/**', 'deploy/kubero/**', '.dockerignore', '.github/workflows/kubero-images.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'web/**', 'deploy/kubero/**', '.dockerignore', '.github/workflows/kubero-images.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubero-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      POSTGRES_PASSWORD: ephemeral-ci-postgres
      MINIO_ROOT_USER: kubero-ci
      MINIO_ROOT_PASSWORD: ephemeral-ci-minio-password
      JWT_ISSUER: apuntesuct-ci-auth
      JWT_AUDIENCE: apuntesuct-ci-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate disposable Auth signing key
        shell: bash
        run: |
          key_dir=$(mktemp -d "$RUNNER_TEMP/kubero-jwt.XXXXXX")
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$key_dir/private.pem"
          # Compose file secrets preserve host permissions; Auth runs as UID 1000.
          # The containing directory remains 0700 on the runner.
          chmod 0444 "$key_dir/private.pem"
          echo "JWT_PRIVATE_KEY_FILE=$key_dir/private.pem" >> "$GITHUB_ENV"
          echo "KUBERO_JWT_KEY_DIR=$key_dir" >> "$GITHUB_ENV"
      - name: Build and start isolated stack
        run: docker compose -f deploy/kubero/compose.yaml up --build --wait --wait-timeout 180
      - name: Check Web, Gateway and services
        run: node deploy/kubero/smoke.mjs
      - name: Container logs on failure
        if: failure()
        run: docker compose -f deploy/kubero/compose.yaml logs --no-color --tail=100
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          push_image() {
            for attempt in 1 2 3; do
              if docker push "$1"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Push failed for $1 (attempt $attempt/3); retrying in 10 seconds."
                sleep 10
              fi
            done
            return 1
          }
          for service in web api-gateway auth-service catalog-service material-service search-service minio; do
            source="apuntesuct/kubero-${service}:local"
            target="ghcr.io/${owner}/apuntesuct-kubero-${service}"
            docker tag "$source" "${target}:sha-${GITHUB_SHA}"
            docker tag "$source" "${target}:latest"
            push_image "${target}:sha-${GITHUB_SHA}"
            push_image "${target}:latest"
          done
      - name: Remove isolated stack
        if: always()
        run: docker compose -f deploy/kubero/compose.yaml down --volumes --remove-orphans
      - name: Remove disposable signing key
        if: always()
        shell: bash
        run: |
          if [ -n "${KUBERO_JWT_KEY_DIR:-}" ]; then
            rm -rf -- "$KUBERO_JWT_KEY_DIR"
          fi
